<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c806e">
<meta name="description" content="Examora for students: exams, results and progress.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>
html,body{margin:0;width:100%;height:100%;background:#f6f7f9;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
iframe{border:0;width:100%;height:100%;display:block}
.msg{font:16px system-ui,Tahoma,sans-serif;text-align:center;margin:20vh 16px;color:#b42318}
.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;
  border-radius:12px;background:#14171c;color:#fff;font:14px/1.4 system-ui,Tahoma,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.bar span{flex:1 1 180px}.bar.warn{background:#8a5a00}
.bar button{font:inherit;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.bar button.main{background:#0c806e;border-color:#0c806e}
.hide{display:none}
</style>
</head>
